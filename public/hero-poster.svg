<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1815"/>
      <stop offset="0.5" stop-color="#121110"/>
      <stop offset="1" stop-color="#0a0909"/>
    </linearGradient>

    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A96A" stop-opacity="0.52"/>
      <stop offset="0.55" stop-color="#C9A96A" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#C9A96A" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.72" cy="0.10" r="0.66">
      <stop offset="0" stop-color="#C9A96A" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#C9A96A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vig" cx="0.5" cy="0.40" r="0.78">
      <stop offset="0.32" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.78"/>
    </radialGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- Room -->
  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Light through venetian blinds, raked across the room.
       Positioned right-of-centre: the hero's left-to-right scrim is opaque
       on the left, so shafts placed there would be washed out entirely. -->
  <g filter="url(#soft)">
    <g transform="skewX(-19) translate(840 0)">
      <rect x="0"   y="-100" width="112" height="1100" fill="url(#shaft)"/>
      <rect x="196" y="-100" width="84"  height="1100" fill="url(#shaft)" opacity="0.80"/>
      <rect x="360" y="-100" width="60"  height="1100" fill="url(#shaft)" opacity="0.62"/>
      <rect x="500" y="-100" width="42"  height="1100" fill="url(#shaft)" opacity="0.46"/>
      <rect x="622" y="-100" width="28"  height="1100" fill="url(#shaft)" opacity="0.32"/>
    </g>
  </g>

  <!-- Vignette -->
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
